# ClusterFuzzLite on pull requests (doc/FUZZING): every fuzz target, built
# with libFuzzer under ASan and under UBSan, fuzzed for a few minutes in
# code-change mode (the targets whose code the pull request changes). The
# corpus is read from the cflite-corpus branch that the batch run keeps.
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths-ignore:
      - "doc/**"
      - "**.md"
      - "ChangeLog"
      - "README"

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # the checkout, and the corpus branch
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          storage-repo: https://github.com/${{ github.repository }}.git
          storage-repo-branch: cflite-corpus
