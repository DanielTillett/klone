# CodeQL (security-extended queries) on Klin's C code; results go to the
# repository's code scanning alerts.
name: CodeQL

on:
  push:
    branches: [master, "rename/**"]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev cmake ninja-build pkg-config
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build (from the checkout, so that alerts point at its files)
        run: |
          python3 -c "import sys; sys.path.insert(0, 'build'); import build; build.dependencies(False)"
          cmake -S . -B out -G Ninja -DKLIN_BUILD_TESTS=ON
          cmake --build out
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: c-cpp
