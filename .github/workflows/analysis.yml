# Static analysis with clang-tidy (.clang-tidy: the clang static analyzer,
# bugprone and a few CERT checks) over Klin's own sources; LibU is not
# checked. doc/FUZZING, STATIC ANALYSIS.
name: Static analysis

on:
  push:
    branches-ignore: ["wip/**", "cflite-*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy libssl-dev zlib1g-dev cmake ninja-build pkg-config
      - name: Configure (compile_commands.json)
        run: |
          python3 -c "import sys; sys.path.insert(0, 'build'); import build; build.dependencies(False)"
          CC=clang cmake -S . -B out -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DKLIN_BUILD_TESTS=ON
          # generated headers (klin_conf.h, LibU's) must exist
          cmake --build out --target klin_utils
      - name: clang-tidy
        run: |
          run-clang-tidy -p out -quiet -j "$(nproc)" "$PWD/src/" > clang-tidy.log 2>&1 || true
          findings=$(grep -cE ': (warning|error): ' clang-tidy.log || true)
          echo "clang-tidy: $findings findings" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E ': (warning|error): ' clang-tidy.log | sed 's|^'"$PWD"'/||' | sort -u | head -200 | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -qE ': error: ' clang-tidy.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: clang-tidy
          path: clang-tidy.log
