# OpenSSF Scorecard (doc/RELEASES, WORKFLOWS): weekly and on pushes to
# master, a check of the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, signed releases, ...).
# Results go to the repository's code scanning alerts and a workflow
# artifact. publish_results is false: nothing is sent to the public
# Scorecard API, so there is no Scorecard badge. Setting it to true (and
# giving the job id-token: write) publishes the results.
name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "29 2 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # the workflow runs (CI-Tests, SAST checks)
      security-events: write   # upload the results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
